pipeline: dl
inherits: configs/shared.yaml

model:
  # EfficientNetV2-B0 (timm name: tf_efficientnetv2_b0)
  backbone: tf_efficientnetv2_b0
  family: cnn
  pretrained: true
  dropout: 0.2
  num_classes: null  # inferred from data at runtime

  # Transformer-only knobs — ignored for CNN
  transformer:
    img_size: 224
    patch_size: 16
    use_flash_attn: false

train:
  batch_size: 64
  epochs: 30               # Full end-to-end training (smooth continuous curves)
  warmup_epochs: 5         # Linear warmup for first 5 epochs
  lr: 3.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  primary_metric: macro_f1 # Select checkpoint and best metrics by validation macro_f1
  amp: true
  require_wandb: true
  with_aug: true           # append X_train_aug.npy from shared preprocessing
  two_stage: false         # Single-stage full training without stage split

aug:
  hflip: false             # LOCKED: mirror-pair classes exist (see shared.yaml)
  color_jitter: 0.1
  random_resized_crop: false

distributed:
  backend: nccl
  find_unused_parameters: false

eval:
  auto_eval_test: true     # Automatically evaluate checkpoint_best.pt on test set after training
  split: test

data:
  processed_root: ${SVM_PROCESSED_ROOT:data/processed}
