pipeline: svm
inherits: configs/shared.yaml

data_source:
  type: shared
  processed_root: ${SVM_PROCESSED_ROOT:data/processed}

features:
  backend: shared
  # HOG/LBP/color matrices are written by tools.run_preprocess.
  # Their parameters come from configs/shared.yaml.

dim_reduction:
  method: none
  pca:
    n_components: 0.95
    whiten: false
  lda:
    n_components: null
    solver: svd

model:
  estimator: svc
  kernel: rbf
  C: 1.0
  gamma: scale
  degree: 3
  coef0: 0.0
  class_weight: balanced
  probability: false
  decision_function_shape: ovo

train:
  require_wandb: true
  save_model: true
  with_aug: true

evaluation:
  evaluate_test_after_train: false

tuning:
  enabled: false
  method: grid
  cv_folds: 5
  scoring: f1_macro
  n_jobs: -1
  n_iter: 20
  param_grid:
    svm__C: [0.1, 1.0, 10.0]
    svm__gamma: [scale, auto]
